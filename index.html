eave in the ground under a village?","How far did the water reach in your partner’s village — and how often?","Can 500 years of layers tell you where a house will be safe for the next 50?"],flowTitle:"Investigation Flow",flow:["Make a history","Swap","Build","Look back","Look ahead"],start:"Start",t:{aboutTitle:"What Is This Activity About?",about:"Each student makes 500 years of history for a river village by choosing a climate and placing flood and forest events. Partners then swap only the ground. Each student reads the partner’s layers to decide where houses would be safe, then checks those choices against the partner’s real history and ten possible futures.",questionLabel:"L3.4 Question",question:"What can layers tell us about the water or weather events that formed them?",goalsTitle:"Learning Goals",goals:["Infer past floods — how many, how far, how strong — from the thickness, grain size, sorting and charcoal of layers in a slice.","Connect the energy of an event to what it leaves: bigger floods leave thicker, coarser, unsorted layers and can cut into the layers below.","Use layers as evidence to choose where to build, weighing what the river gives against the risk of floods (MS-ETS1-1).","Recognize that the past record shows what can happen, not exactly what will happen."],handsOnTitle:"Relationship to the Hands-on Lesson",handsOn:"Use this after the modeling part of L3.4, where students build model rock samples in cylinders for different weather events. The simulation applies the same idea — different events leave different layers — to a river floodplain over 500 years, and then asks students to use the layers as evidence for a decision.",howTitle:"How to Use It",howMeta:"About 13 minutes · Pairs (a group of 3 also works) · One device per student",how:[["Welcome","About 1 minute. Read this page together. Each student works on their own device."],["Make a history","3–3.5 minutes. Three short slides show how to read the block. Then each student picks a climat 층을 판단의 증거로 쓰게 합니다.",howTitle:"사용 방법",howMeta:"약 13분 · 2인 1조 (3명도 가능) · 학생마다 기기 하나",how:[["도입","약 1분. 이 페이지를 함께 읽습니다. 학생마다 자기 기기에서 진행합니다."],["역사 만들기","3~3.5분. 짧은 슬라이드 세 장으로 블록 읽는 법을 익힌 뒤, 기후를 고르고 사건 카드 10장을 500년에 놓습니다. 카드를 놓을 때마다 땅이 바뀝니다."],["교환","약 1분. 짝과 22자 코드를 주고받습니다. 넘어가는 것은 땅, 기후, 주민 세 명의 기억뿐 — 사건은 넘어가지 않습니다."],["집 짓기","2~3분. 짝의 지층을 읽고 강에서 거리가 다른 곳에 집 4채를 놓은 뒤, 50년 동안 각 집이 얼마나 자주 잠길지 예측합니다."],["과거 보기","약 1.5분. 짝의 실제 500년이 타임랩스로 재생됩니다. 집은 놓은 자리에 그대로 있습니다."],["미래 보기","3~4분. 가능한 50년을 열 번 돌려 예측과 비교하고, 화면의 질문으로 짝과 이야기합니다."],["마무리","약 1분. 이웃이 기억한 것과 땅이 기억한 것을 나란히 보여 주고, 어떤 단서를 썼는지 고르게 한 뒤, 차시 질문으로 끝납니다. 여기의 “처음부터 다시”로 다음 학생을 위해 기기를 비웁니다."]],featuresTitle:"이 탐구의 특징",features:["앱은 어디가 안전한지 말하지 않습니다. 물이 각 집에 몇 번 닿았는지만 보여 줍니다.","역사를 만든 학생은 모든 사건을 압니다. 짝은 땅, 기후, 주민 세 명의 기억(15~50년)만 받습니다. 사람의 기억과 땅의 기억 사이의 그 간극이 이 활동의 핵심입니다.","열 번의 50년은 흔한 홍수를, 500년 기록은 드문 홍수를 보여 줍니다. 둘 다 필요합니다.","먼저 판단하고 나중에 확인합니다: 과거가 공개되기 전에 집 위치가 고정됩니다."],processLabel:"학생 과정",process:["지층 읽기","예측","과거 확인","미래 시험","대화"],promptsTitle:"토론 질문",promptsLead:"앞의 세 질문은 미래 보기 화면에서 짝마다 나옵니다. 마지막 질문은 학급 전체를 차시 질문으로 되돌립니다.",wrapUp:"차시 질문으로 돌아가기: 층은 그것을 만든 물·기상 사건에 대해 무엇을 말해 주는가? 오늘 본 층 하나를 증거로 들어 보세요.",extendTitle:"실제 장소로 넓히기",extend:"과학자들은 실제 강가의 홍수 퇴적층을 읽어 어떤 기록보다 오래된 홍수를 찾아냅니다. 질문: 우리 학교 근처의 어느 강에 이런 기록이 남아 있을까? 누가 그 기록을 읽고 싶어 할까?",notesTitle:"운영 참고",notes:["앱 전체가 HTML 파일 하나이고 인터넷 없이 열립니다.","3명 모둠은 코드를 돌려 넘깁니다 (A → B → C → A). 교사 코드 하나를 학급 전체에 줄 수도 있습니다.","진행 상태는 그 기기에 남습니다. 3시간 동안 쓰지 않거나, 마지막 화면의 “처음부터 다시”를 누르면 지워집니다.","얇은 층이 보이도록 높이를 150배 늘렸습니다. 실제 범람원은 거의 평평합니다.","열 번의 미래가 500년 기록보다 안전해 보일 수 있습니다. 정상이며, 좋은 토론거리입니다."]}},guide:{example:"예시 마을 — 내 마을은 이 안내 다음에 시작해요",slides:[{title:"블록 읽는 법",body:"윗면은 땅의 겉면이고, 앞면은 땅을 자른 단면이에요. 둘은 왼쪽에서 오른쪽까지 같은 거리를 나타내요. 그래서 홍수가 지표에서 퍼진 거리가 곧 단면에서 그 층이 뻗은 거리예요. 높이는 150배 늘려 그렸어요 — 실제 범람원은 거의 평평해요."},{title:"조작해 보기",body:"마우스 휠, 두 손가락, + − 단추로 확대해요. 확대한 뒤에는 끌어서 움직여요. ⌂를 누르면 블록 전체를 다시 봐요."},{title:"층은 무엇일까",body:"지층 범례는 층마다 단면에서 어떻게 보이는지 알려 줘요. 그림 왼쪽 아래 “지층 범례” 단추로 언제든 다시 열 수 있어요."}
